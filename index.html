<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍳 Cooking App - Pi Testnet</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  font-family:Arial;
  max-width:750px;
  margin:auto;
  padding:25px;
  text-align:center;
  background:#fafafa;
}

h1{ color:#5c2d91; }

button{
  padding:14px 20px;
  border:none;
  border-radius:10px;
  background:#5c2d91;
  color:white;
  margin:10px;
  cursor:pointer;
}

button:hover{ opacity:0.9; }

#status{
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:10px;
  min-height:120px;
  text-align:left;
  white-space:pre-line;
}

.counter{
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🍳 Cooking App</h1>

<button onclick="login()">🔑 Connecter Pi</button>
<button onclick="testPayment()">💳 Transaction Test</button>

<div class="counter" id="counter">Transactions : 0</div>

<div id="status">Initialisation...</div>

<script>

if(!window.Pi){
  document.getElementById("status").innerText =
    "❌ Ouvre dans Pi Browser";
  throw new Error("Pi SDK missing");
}

const Pi = window.Pi;

Pi.init({
  version:"2.0",
  sandbox:true
});

let currentUser = null;
let txCount = 0;

/* 🔒 IMPORTANT: verrou global */
let paymentRunning = false;
let activePaymentId = null;

/* ================= UI ================= */
function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function updateCounter(){
  document.getElementById("counter").innerText =
    "Transactions : " + txCount;
}

/* ================= LOGIN ================= */
async function login(){
  try{
    setStatus("🔄 Connexion...");

    const auth = await Pi.authenticate(["payments","username"]);
    currentUser = auth.user;

    setStatus("✅ Connecté\n" + currentUser.username);

  }catch(e){
    setStatus("❌ Login error\n" + e.message);
  }
}

/* ================= BACKEND ================= */
async function approvePayment(paymentId){
  const res = await fetch("/api/approve", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({paymentId})
  });

  const data = await res.json();
  if(!res.ok) throw new Error(data.error);
  return data;
}

async function completePayment(paymentId){
  const res = await fetch("/api/complete", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({paymentId})
  });

  const data = await res.json();
  if(!res.ok) throw new Error(data.error);
  return data;
}

/* ================= PAYMENT ================= */
function testPayment(){

  /* 🔒 1 SEUL PAYMENT À LA FOIS */
  if(paymentRunning){
    alert("⛔ Une transaction est déjà en cours");
    return;
  }

  if(!currentUser){
    alert("Connecte-toi d'abord");
    return;
  }

  paymentRunning = true;
  activePaymentId = null;

  setStatus("🔄 Création paiement...");

  Pi.createPayment(
    {
      amount:0.01,
      memo:"Cooking App TX #" + Date.now()
    },
    {

      /* ================= APPROVAL ================= */
      onReadyForServerApproval: async function(paymentId){

        activePaymentId = paymentId;

        try{
          setStatus("🟡 Approval...");

          await approvePayment(paymentId);

          setStatus("✅ Approved");

        }catch(e){
          paymentRunning = false;
          activePaymentId = null;

          setStatus("❌ Approval failed\n" + e.message);
        }
      },

      /* ================= COMPLETION ================= */
      onReadyForServerCompletion: async function(paymentId, txid){

        try{
          setStatus("🟢 Completion...");

          await completePayment(paymentId);

          txCount++;
          updateCounter();

          paymentRunning = false;
          activePaymentId = null;

          setStatus(
            "✅ Transaction OK\n\nTXID:\n" + txid
          );

        }catch(e){
          paymentRunning = false;
          activePaymentId = null;

          setStatus("❌ Completion failed\n" + e.message);
        }
      },

      /* ================= CANCEL ================= */
      onCancel:function(){
        paymentRunning = false;
        activePaymentId = null;

        setStatus("❌ Cancelled");
      },

      /* ================= ERROR ================= */
      onError:function(err){
        paymentRunning = false;
        activePaymentId = null;

        setStatus("❌ SDK Error\n" + JSON.stringify(err,null,2));
      }

    }
  );
}

/* ================= INIT ================= */
setStatus("✅ Ready");

</script>

</body>
</html>
