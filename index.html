<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Cooking App Test</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    #status {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <h1>🍳 Cooking App</h1>

  <button onclick="connectPi()">
    Connecter Pi
  </button>

  <div id="status">
    En attente...
  </div>

  <script>

    const statusDiv =
      document.getElementById("status");

    function setStatus(msg) {
      statusDiv.innerText = msg;
      console.log(msg);
    }

    async function connectPi() {

      try {

        if (!window.Pi) {

          setStatus(
            "❌ Pi SDK introuvable\n\n" +
            "Ouvre l'app dans Pi Browser"
          );

          return;
        }

        const Pi = window.Pi;

        // INIT
        Pi.init({
          sandbox: true
        });

        setStatus(
          "🔄 Connexion Pi..."
        );

        // petit délai
        await new Promise(resolve =>
          setTimeout(resolve, 1500)
        );

        // AUTH
        const auth =
          await Pi.authenticate(
            ["username", "payments"],
            function(payment) {
              console.log(payment);
            }
          );

        setStatus(
          "✅ Connecté\n\n" +
          "Utilisateur: " +
          auth.user.username +
          "\nUID: " +
          auth.user.uid
        );

      } catch (e) {

        console.error(e);

        setStatus(
          "❌ Erreur\n\n" +
          (e.message || "Erreur inconnue")
        );
      }
    }

  </script>

</body>
</html>
