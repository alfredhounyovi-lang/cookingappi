<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍳 Cooking App - Pi Testnet</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:750px;
  margin:auto;
  padding:25px;
  text-align:center;
  background:#fafafa;
}

h1{ color:#5c2d91; }

button{
  padding:14px 20px;
  border:none;
  border-radius:10px;
  background:#5c2d91;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}

button:hover{ opacity:0.9; }

input{
  width:92%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:10px;
}

#status{
  margin-top:20px;
  padding:18px;
  background:white;
  border-radius:12px;
  border:1px solid #ddd;
  text-align:left;
  white-space:pre-line;
  min-height:140px;
}

.counter{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.wallet-box{
  margin-top:30px;
  background:white;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<h1>🍳 Cooking App</h1>

<button onclick="login()">🔑 Connecter Pi</button>
<button onclick="testPayment()">💳 Transaction Test</button>
<button onclick="fixPendingPayments()">🛠 Confirmer Paiements</button>

<div class="counter" id="counter">Transactions : 0 / 10</div>

<div class="wallet-box">
<h3>📤 Wallet Testnet</h3>

<input id="walletAddress" placeholder="Colle une adresse G..." />
<button onclick="saveWallet()">💾 Ajouter Adresse</button>
</div>

<div id="status">Initialisation...</div>

<script>

if(!window.Pi){
  document.getElementById("status").innerText =
    "❌ Ouvre dans Pi Browser";
  throw new Error("Pi SDK missing");
}

const Pi = window.Pi;

Pi.init({
  version:"2.0",
  sandbox:true
});

let currentUser = null;
let txCount = 0;
let walletList = [];
let paymentRunning = false;
let activePaymentId = null;

/* ================= STATUS ================= */
function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function updateCounter(){
  document.getElementById("counter").innerText =
    "Transactions : " + txCount + " / 10";
}

/* ================= WALLET ================= */
function saveWallet(){
  const input = document.getElementById("walletAddress");
  const address = input.value.trim();

  if(!address) return alert("Adresse vide");
  if(!address.startsWith("G")) return alert("Adresse invalide");

  walletList.push(address);
  input.value = "";

  setStatus("✅ Wallet ajouté\n\n" + walletList.join("\n"));
}

/* ================= BACKEND ================= */
async function approvePayment(paymentId){

  const res = await fetch("/api/approve", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({paymentId})
  });

  const data = await res.json();

  if(!res.ok) throw new Error(data.error || "approve error");

  return data;
}

async function completePayment(paymentId){

  const res = await fetch("/api/complete", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({paymentId})
  });

  const data = await res.json();

  if(!res.ok) throw new Error(data.error || "complete error");

  return data;
}

/* ================= LOGIN ================= */
async function login(){
  try{
    setStatus("🔄 Connexion Pi...");

    const auth = await Pi.authenticate(["payments","username"]);

    currentUser = auth.user;

    setStatus(
      "✅ Connecté\n\n" + currentUser.username
    );

  }catch(e){
    setStatus("❌ Login error\n\n" + e.message);
  }
}

/* ================= PAYMENT ================= */
function testPayment(){

  if(paymentRunning) return alert("Déjà en cours");
  if(!currentUser) return alert("Connecte-toi");

  paymentRunning = true;
  activePaymentId = null;

  Pi.createPayment(
    {
      amount:0.01,
      memo:"Cooking App Test #" + Date.now(),
      metadata:{wallets:walletList}
    },
    {

      onReadyForServerApproval: async function(paymentId){

        try{
          activePaymentId = paymentId;

          setStatus("🟡 Approval...");

          await approvePayment(paymentId);

          setStatus("✅ Approved");

        }catch(e){
          paymentRunning = false;
          setStatus("❌ Approval error\n\n" + e.message);
        }
      },

      onReadyForServerCompletion: async function(paymentId, txid){

        try{
          setStatus("🟡 Completion...");

          await completePayment(paymentId);

          txCount++;
          updateCounter();

          paymentRunning = false;

          setStatus(
            "✅ Paiement confirmé\n\nTXID:\n" + txid
          );

        }catch(e){
          paymentRunning = false;
          setStatus("❌ Completion error\n\n" + e.message);
        }
      },

      onCancel:function(){
        paymentRunning = false;
        setStatus("❌ Cancelled");
      },

      onError:function(err){
        paymentRunning = false;
        setStatus("❌ SDK Error\n\n" + JSON.stringify(err,null,2));
      }

    }
  );
}

/* ================= FIX PENDING ================= */
async function fixPendingPayments(){

  try{

    setStatus("🔄 Checking pending...");

    await Pi.authenticate(["payments"], async function(payment){

      const paymentId = payment.identifier;

      if(!paymentId){
        setStatus("❌ Aucun pending");
        return;
      }

      setStatus("🟡 Fixing pending...");

      await approvePayment(paymentId);
      await completePayment(paymentId);

      setStatus("✅ Pending fixed");

    });

  }catch(e){
    setStatus("❌ Error\n\n" + e.message);
  }
}

window.onload = () => {
  setStatus("✅ SDK prêt");
};

</script>

</body>
</html>
