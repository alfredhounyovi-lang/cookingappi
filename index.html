<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>🍳 Cooking App - Pi Testnet</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>

body{
  font-family:Arial,sans-serif;
  max-width:750px;
  margin:auto;
  padding:25px;
  text-align:center;
  background:#fafafa;
}

h1{
  color:#5c2d91;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:10px;
  background:#5c2d91;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}

button:hover{
  opacity:0.9;
}

input{
  width:92%;
  padding:14px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:10px;
  font-size:15px;
}

#status{
  margin-top:20px;
  padding:18px;
  background:white;
  border-radius:12px;
  border:1px solid #ddd;
  text-align:left;
  white-space:pre-line;
  min-height:140px;
}

.counter{
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.wallet-box{
  margin-top:30px;
  background:white;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd;
}

</style>

</head>

<body>

<h1>🍳 Cooking App</h1>

<button onclick="login()">
🔑 Connecter Pi
</button>

<button onclick="testPayment()">
💳 Transaction Test
</button>

<div class="counter" id="counter">
Transactions : 0 / 10
</div>

<div class="wallet-box">

<h3>
📤 Wallet Testnet
</h3>

<input
  id="walletAddress"
  placeholder="Colle une adresse Testnet G..."
/>

<button onclick="saveWallet()">
💾 Ajouter Adresse
</button>

</div>

<div id="status">
Initialisation du SDK...
</div>

<script>

if (!window.Pi) {

  document.getElementById(
    "status"
  ).innerText =

    "❌ Pi SDK introuvable\n\n" +

    "Ouvre cette app dans Pi Browser";

  throw new Error(
    "Pi SDK not found"
  );

}

const Pi = window.Pi;

console.log("✅ PI SDK:", Pi);

Pi.init({

  version: "2.0",

  sandbox: true

});

console.log(
  "✅ Pi SDK initialisé"
);

let currentUser = null;
let txCount = 0;
let walletList = [];
let paymentRunning = false;

function setStatus(message){

  document.getElementById(
    "status"
  ).innerText = message;

}

function updateCounter(){

  document.getElementById(
    "counter"
  ).innerText =

    "Transactions : " +

    txCount +

    " / 10";

}

function saveWallet(){

  const input =

    document.getElementById(
      "walletAddress"
    );

  const address =

    input.value.trim();

  if(!address){

    alert(
      "Entre une adresse"
    );

    return;
  }

  if(!address.startsWith("G")){

    alert(

      "Adresse Pi invalide\n\n" +

      "Une adresse Pi commence par G"

    );

    return;
  }

  walletList.push(address);

  input.value = "";

  setStatus(

    "✅ Adresse ajoutée\n\n" +

    "Total wallets : " +

    walletList.length +

    "\n\n" +

    walletList.join("\n")

  );

}

async function login(){

  try{

    setStatus(
      "🔄 Connexion Pi..."
    );

    const auth =

      await Pi.authenticate(
async function login(){

  try{

    setStatus(
      "🔄 Connexion Pi..."
    );

    const auth =

      await Pi.authenticate(

        ["payments", "username"],

        async function(payment){

          console.log(
            "⚠️ PENDING PAYMENT:",
            payment
          );

          setStatus(

            "⚠️ Paiement en attente détecté\n\n" +

            JSON.stringify(
              payment,
              null,
              2
            )

          );

          try{

            const paymentId =

              payment.identifier;

            if(!paymentId){

              setStatus(
                "❌ Payment ID introuvable"
              );

              return;
            }

            setStatus(
              "🟡 Approval ancien paiement..."
            );

            await approvePayment(
              paymentId
            );

            setStatus(
              "🟡 Finalisation ancien paiement..."
            );

            await completePayment(
              paymentId
            );

            setStatus(

              "✅ Ancien paiement confirmé"

            );

          }catch(err){

            console.error(err);

            setStatus(

              "❌ Impossible de compléter l'ancien paiement\n\n" +

              (
                err.message ||

                JSON.stringify(
                  err,
                  null,
                  2
                )
              )

            );

          }

        }

      );

    currentUser = auth.user;

    console.log(
      "✅ USER:",
      currentUser
    );

    setStatus(

      "✅ Connecté à Pi\n\n" +

      "Utilisateur : " +

      currentUser.username +

      "\nUID : " +

      currentUser.uid

    );

  }catch(error){

    console.error(error);

    setStatus(

      "❌ Erreur connexion\n\n" +

      (
        error.message ||

        JSON.stringify(
          error,
          null,
          2
        )
      )

    );

  }

  }

async function approvePayment(paymentId){

  console.log(
    "🟡 APPROVE REQUEST:",
    paymentId
  );

  const response =

    await fetch(

      "/api/approve",

      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          paymentId
        })

      }

    );

  const data =

    await response.json();

  console.log(
    "🟡 APPROVE RESPONSE:",
    data
  );

  if(!response.ok){

    throw new Error(

      data.error ||

      "Erreur approval"

    );

  }

  return data;

}

async function completePayment(paymentId){

  console.log(
    "🟢 COMPLETE REQUEST:",
    paymentId
  );

  const response =

    await fetch(

      "/api/complete",

      {

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          paymentId
        })

      }

    );

  const data =

    await response.json();

  console.log(
    "🟢 COMPLETE RESPONSE:",
    data
  );

  if(!response.ok){

    throw new Error(

      data.error ||

      "Erreur completion"

    );

  }

  return data;

}

function testPayment(){

  if(paymentRunning){

    alert(
      "Un paiement est déjà en cours"
    );

    return;
  }

  if(!currentUser){

    alert(
      "Connecte-toi d'abord"
    );

    return;
  }

  if(txCount >= 10){

    alert(
      "🎉 Les 10 transactions sont terminées"
    );

    return;
  }

  paymentRunning = true;

  try{

    setStatus(
      "🔄 Création paiement..."
    );

    Pi.createPayment(

      {

        amount: 0.01,

        memo:

          "Cooking App Test #" +

          (txCount + 1) +

          "-" +

          Date.now(),

        metadata:{

          orderId:
            txCount + 1,

          wallets:
            walletList

        }

      },

      {

        onReadyForServerApproval:
        async function(paymentId){

          try{

            setStatus(
              "🟡 Approval..."
            );

            await approvePayment(
              paymentId
            );

            setStatus(
              "✅ Paiement approuvé"
            );

          }catch(error){

            console.error(error);

            paymentRunning = false;

            setStatus(

              "❌ Approval erreur\n\n" +

              error.message

            );

          }

        },

        onReadyForServerCompletion:
        async function(paymentId){

          try{

            setStatus(
              "🟡 Finalisation..."
            );

            await completePayment(
              paymentId
            );

            txCount++;

            updateCounter();

            paymentRunning = false;

            setStatus(

              "✅ Transaction réussie\n\n" +

              "Transactions : " +

              txCount +

              "/10"

            );

          }catch(error){

            console.error(error);

            paymentRunning = false;

            setStatus(

              "❌ Completion erreur\n\n" +

              error.message

            );

          }

        },

        onCancel:function(paymentId){

          console.log(
            "❌ CANCEL:",
            paymentId
          );

          paymentRunning = false;

          setStatus(
            "❌ Paiement annulé"
          );

        },

        onError:function(error){

          console.error(
            "❌ SDK ERROR:",
            error
          );

          paymentRunning = false;

          setStatus(

            "❌ Erreur Pi SDK\n\n" +

            JSON.stringify(
              error || {},
              null,
              2
            )

          );

        }

      }

    );

  }catch(error){

    console.error(error);

    paymentRunning = false;

    setStatus(

      "❌ Erreur paiement\n\n" +

      (
        error.message ||

        JSON.stringify(
          error,
          null,
          2
        )
      )

    );

  }

}

setStatus(
  "✅ SDK Pi chargé"
);

</script>

</body>
  </html>
