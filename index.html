<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍳 Cooking App - Pi Testnet</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: auto;
      padding: 25px;
      text-align: center;
      background: #fafafa;
    }

    h1 { 
      color: #5c2d91; 
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #5c2d91;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      transition: opacity 0.2s;
    }

    button:hover { 
      opacity: 0.9; 
    }

    input {
      width: 92%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      border: 1px solid #ddd;
      text-align: left;
      white-space: pre-line;
      min-height: 140px;
    }

    .counter {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .wallet-box {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <h1>🍳 Cooking App</h1>

  <button onclick="login()">🔑 Connecter Pi</button>
  <button onclick="testPayment()">💳 Transaction Test</button>
  <button onclick="fixPendingPayments()">🛠 Confirmer Paiements</button>

  <div class="counter" id="counter">Transactions : 0 / 10</div>

  <div class="wallet-box">
    <h3>📤 Wallet Testnet</h3>
    <input id="walletAddress" placeholder="Colle une adresse G..." />
    <button onclick="saveWallet()">💾 Ajouter Adresse</button>
  </div>

  <div id="status">Initialisation...</div>

  <script>
    // 1. Sécurité : Vérifier si l'application est bien ouverte dans le Pi Browser
    if (!window.Pi) {
      document.getElementById("status").innerText = "❌ Erreur : Ouvre cette application dans le Pi Browser.";
      throw new Error("Pi SDK missing");
    }

    const Pi = window.Pi;

    // 2. Initialisation du SDK Pi
    Pi.init({
      version: "2.0",
      sandbox: true // /!\ Mettre à false lors du passage en Production / Mainnet
    });

    // Variables globales de l'application
    let currentUser = null;
    let txCount = 0;
    let walletList = [];
    let paymentRunning = false;

    /* ================= MISE À JOUR DE L'INTERFACE ================= */
    function setStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    function updateCounter() {
      document.getElementById("counter").innerText = "Transactions : " + txCount + " / 10";
    }

    /* ================= GESTION DES WALLETS ================= */
    function saveWallet() {
      const input = document.getElementById("walletAddress");
      const address = input.value.trim();

      if (!address) return alert("L'adresse ne peut pas être vide.");
      if (!address.startsWith("G") || address.length !== 56) {
        return alert("Adresse invalide. Une adresse Pi doit commencer par 'G' et faire exactement 56 caractères.");
      }

      walletList.push(address);
      input.value = "";

      setStatus("✅ Wallet ajouté avec succès !\n\nListe actuelle :\n" + walletList.join("\n"));
    }

    /* ================= APPELS API VERS TON BACKEND ================= */
    // Étape 1 : Demander au backend d'approuver le paiement auprès de Pi Network
    async function approvePayment(paymentId) {
      const res = await fetch("/api/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paymentId })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur lors de l'approbation du serveur.");
      return data;
    }

    // Étape 2 : Demander au backend de marquer le paiement comme complété
    async function completePayment(paymentId, txid) {
      const res = await fetch("/api/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paymentId, txid })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erreur lors de la complétion du serveur.");
      return data;
    }

    /* ================= AUTHENTIFICATION & PENDINGS ================= */
    async function login() {
      try {
        setStatus("🔄 Connexion à Pi Network...");

        // Authentification + Liaison avec la fonction de récupération des paiements interrompus
        const auth = await Pi.authenticate(["payments", "username"], onIncompletePaymentFound);

        currentUser = auth.user;
        setStatus("✅ Connecté avec succès\n\nUtilisateur : " + currentUser.username);

      } catch (e) {
        setStatus("❌ Erreur de connexion :\n\n" + e.message);
      }
    }

    // Fonction cruciale imposée par Pi : s'exécute si une transaction précédente a été coupée en plein milieu
    async function onIncompletePaymentFound(payment) {
      try {
        setStatus("⚠️ Transaction incomplète détectée !\nTentative de résolution...");
        const paymentId = payment.identifier;
        const txid = payment.transaction ? payment.transaction.txid : null;

        // Si le paiement n'avait pas encore été approuvé par ton serveur
        if (payment.status.developer_approved === false) {
          await approvePayment(paymentId);
        }
        
        // Si la transaction a été faite sur la blockchain mais non validée côté serveur
        if (payment.status.developer_completed === false && txid) {
          await completePayment(paymentId, txid);
        }

        setStatus("✅ Paiement incomplet résolu et synchronisé !");
      } catch (e) {
        setStatus("❌ Impossible de résoudre le paiement suspendu :\n\n" + e.message);
      }
    }

    /* ================= FLUX DE PAIEMENT PI ================= */
    function testPayment() {
      if (paymentRunning) return alert("Une transaction est déjà en cours de traitement.");
      if (!currentUser) return alert("Veuillez d'abord vous connecter avec le bouton 'Connecter Pi'.");

      paymentRunning = true;

      Pi.createPayment(
        {
          amount: 0.01,
          memo: "Cooking App Test #" + Date.now(),
          metadata: { wallets: walletList }
        },
        {
          // Appelé quand l'utilisateur clique, mais avant qu'il ne tape son mot de passe de wallet
          onReadyForServerApproval: async function(paymentId) {
            try {
              setStatus("🟡 Étape 1 : Approbation de la transaction par le serveur...");
              await approvePayment(paymentId);
              setStatus("✅ Étape 1 réussie. En attente de la signature de l'utilisateur dans son portefeuille...");
            } catch (e) {
              paymentRunning = false;
              setStatus("❌ Échec de l'approbation :\n\n" + e.message);
            }
          },

          // Appelé dès que la blockchain Pi a validé le transfert des 0.01 Pi
          onReadyForServerCompletion: async function(paymentId, txid) {
            try {
              setStatus("🟡 Étape 2 : Enregistrement et finalisation de la transaction...");
              await completePayment(paymentId, txid);

              txCount++;
              updateCounter();
              paymentRunning = false;

              setStatus("✅ Transaction réussie et sécurisée !\n\nTXID blockchain :\n" + txid);
            } catch (e) {
              paymentRunning = false;
              setStatus("❌ Échec de la complétion :\n\n" + e.message);
            }
          },

          onCancel: function() {
            paymentRunning = false;
            setStatus("❌ Transaction annulée par l'utilisateur.");
          },

          onError: function(err) {
            paymentRunning = false;
            setStatus("❌ Erreur critique du SDK Pi :\n\n" + JSON.stringify(err, null, 2));
          }
        }
      );
    }

    /* ================= BOUTON DE SECOURS MANUEL ================= */
    async function fixPendingPayments() {
      setStatus("🔄 Relance de la vérification des paiements...");
      // Relancer l'authentification déclenche automatiquement 'onIncompletePaymentFound' s'il y a un blocage
      await login(); 
    }

    // Affichage initial une fois la page totalement chargée
    window.onload = () => {
      setStatus("✅ SDK Pi chargé et prêt.");
    };
  </script>

</body>
  </html>
