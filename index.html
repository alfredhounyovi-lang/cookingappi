<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Cooking App - Test Pi Transactions</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <script>
    const Pi = window.Pi;

    // Init SDK
    Pi.init({ version: "2.0", sandbox: true });

    let transactionCount = 0;

    async function login() {
      try {
        const auth = await Pi.authenticate(["username", "payments"]);
        console.log("Connecté :", auth);
        alert("Connecté : " + auth.user.username);
      } catch (err) {
        console.error(err);
      }
    }

    // 🔥 Fonction pour faire une transaction test
    async function makePayment() {
      if (transactionCount >= 10) {
        alert("🎉 Tu as déjà fait les 10 transactions !");
        return;
      }

      try {
        const payment = await Pi.createPayment({
          amount: 0.01, // petit montant test
          memo: "Test transaction " + (transactionCount + 1),
          metadata: { order: transactionCount + 1 }
        });

        console.log("Paiement créé :", payment);

        transactionCount++;

        alert("Transaction " + transactionCount + "/10 réussie ✅");

        if (transactionCount === 10) {
          alert("🎉 Bravo ! 10 transactions complétées");
        }

      } catch (err) {
        console.error("Erreur paiement :", err);
        alert("Erreur transaction ❌");
      }
    }
  </script>
</head>

<body style="text-align:center; font-family: Arial;">

  <h1>🍳 Cooking App - Test Pi</h1>

  <button onclick="login()">🔑 Connecter Pi</button>
  <br><br>

  <button onclick="makePayment()">💳 Faire une transaction test</button>

  <p id="status">Transactions : 0 / 10</p>

  <script>
    setInterval(() => {
      document.getElementById("status").innerText =
        "Transactions : " + transactionCount + " / 10";
    }, 1000);
  </script>

</body>
</html>
