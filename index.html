<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Cooking App - Pi Testnet</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<style>
body{
  font-family:Arial;
  max-width:700px;
  margin:auto;
  padding:30px;
  text-align:center;
  background:#fafafa;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:10px;
  background:#5c2d91;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}

input{
  width:90%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

#status{
  margin-top:20px;
  padding:15px;
  background:white;
  border-radius:10px;
  border:1px solid #ccc;
  text-align:left;
  white-space:pre-line;
}
</style>

</head>

<body>

<h1>🍳 Cooking App</h1>

<button onclick="login()">
🔑 Connecter Pi
</button>

<button onclick="testPayment()">
💳 Transaction Test
</button>

<p id="counter">
Transactions : 0 / 10
</p>

<div id="status">
Initialisation...
</div>

<script>

const Pi = window.Pi;

Pi.init({
  version: "2.0",
  sandbox: true
});

let currentUser = null;
let txCount = 0;

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function updateCounter(){
  document.getElementById("counter").innerText =
    "Transactions : " + txCount + " / 10";
}

async function login(){

  try{

    const scopes = ['payments','username'];

    const auth = await Pi.authenticate(scopes);

    currentUser = auth.user;

    setStatus(
      "✅ Connecté\n\n" +
      "Utilisateur : " + currentUser.username
    );

  }catch(err){

    console.error(err);

    setStatus("❌ Erreur connexion");

  }

}

async function testPayment(){

  if(!currentUser){
    alert("Connecte-toi d'abord");
    return;
  }

  try{

    const paymentData = {
      amount: 0.01,
      memo: "Cooking App Test",
      metadata: {
        type: "test-payment",
        orderId: txCount + 1
      }
    };

    const payment = await Pi.createPayment(
      paymentData,

      {
        onReadyForServerApproval: function(paymentId){

          console.log("Approve:", paymentId);

          setStatus(
            "🟡 Paiement créé\n" +
            "ID: " + paymentId
          );

        },

        onReadyForServerCompletion: function(paymentId, txid){

          console.log("Complete:", paymentId, txid);

          txCount++;

          updateCounter();

          setStatus(
            "✅ Transaction réussie\n\n" +
            "TXID:\n" + txid + "\n\n" +
            "Transactions : " + txCount + "/10"
          );

        },

        onCancel: function(paymentId){

          setStatus("❌ Paiement annulé");

        },

        onError: function(error, payment){

          console.error(error);

          setStatus(
            "❌ Erreur paiement\n\n" +
            JSON.stringify(error)
          );

        }

      }

    );

  }catch(err){

    console.error(err);

    setStatus(
      "❌ Erreur SDK\n\n" +
      err.message
    );

  }

}

setStatus("✅ SDK chargé");

</script>

</body>
</html>
