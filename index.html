<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />

  <title>🍳 Cooking App - Pi</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: auto;
      text-align: center;
      padding: 40px;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }

    input {
      width: 80%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }

    #status {
      margin-top: 25px;
      text-align: left;
      border: 1px solid #ccc;
      padding: 15px;
      min-height: 150px;
      white-space: pre-line;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🍳 Cooking App</h1>

  <button onclick="startPayment()">
    Payer avec Pi
  </button>

  <div id="status">
    Initialisation...
  </div>

  <hr style="margin-top:50px;">

  <h3>
    🧪 Section Testnet (10 transactions requises)
  </h3>

  <p>
    Entrez l'adresse Testnet d'un ami
  </p>

  <input
    type="text"
    id="friend-wallet"
    placeholder="Adresse wallet Testnet G..."
  />

  <br>

  <button onclick="sendTestReward()">
    Envoyer Récompense Testnet
  </button>

  <script>

    // =========================
    // GLOBALS
    // =========================

    const statusDiv =
      document.getElementById("status");

    let currentUser = null;

    // =========================
    // HELPERS
    // =========================

    function setStatus(msg) {

      statusDiv.innerText = msg;

      console.log(msg);
    }

    function log(msg) {

      statusDiv.innerText += "\n" + msg;

      console.log(msg);
    }

    function isPiReady() {

      return (
        window.Pi &&
        typeof window.Pi.createPayment === "function"
      );
    }

    // =========================
    // INIT PI SDK
    // =========================

    async function initPi() {

      try {

        if (!window.Pi) {

          setStatus(
            "❌ Pi SDK introuvable"
          );

          return;
        }

        // IMPORTANT
        // false = MAINNET
        // true = TESTNET
        window.Pi.init({
          version: "2.0",
          sandbox: true
        });

        setStatus(
          "🔄 Authentification Pi..."
        );

        const scopes = [
          "payments",
          "username"
        ];

        // IMPORTANT FIX
        const auth =
          await window.Pi.authenticate(
            scopes,
            function onIncompletePaymentFound(payment) {

              console.log(
                "Incomplete payment found:",
                payment
              );
            }
          );

        currentUser = auth.user;

        setStatus(
          "✔️ Connecté à Pi\n" +
          "Utilisateur: " +
          currentUser.username
        );

        log(
          "UID: " +
          currentUser.uid
        );

      } catch (e) {

        console.error(e);

        setStatus(
          "❌ Erreur Pi SDK\n\n" +
          "➡️ Vérifie :\n" +
          "- ouverture dans Pi Browser\n" +
          "- app enregistrée Pi Developer Portal\n" +
          "- domaine validé\n" +
          "- Pi Browser connecté"
        );
      }
    }

    // =========================
    // SAFE WAIT SDK
    // =========================

    let tries = 0;

    const interval = setInterval(() => {

      tries++;

      if (window.Pi) {

        clearInterval(interval);

        initPi();
      }

      if (tries > 20) {

        clearInterval(interval);

        setStatus(
          "❌ Pi SDK non détecté\n\n" +
          "➡️ Ouvre l'app dans Pi Browser"
        );
      }

    }, 500);

    // =========================
    // MAIN PAYMENT
    // =========================

    async function startPayment() {

      if (!currentUser) {

        alert(
          "Utilisateur Pi non connecté"
        );

        return;
      }

      setStatus(
        "🔄 Lancement paiement Pi..."
      );

      try {

        window.Pi.createPayment(
          {
            amount: 1,
            memo: "Cooking App Order",
            metadata: {
              product: "food"
            }
          },

          {

            // =====================
            // APPROVE
            // =====================

            onReadyForServerApproval:
            async function(paymentId) {

              log(
                "APPROVE: " +
                paymentId
              );

              try {

                const res =
                  await fetch(
                    "/api/approve",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type":
                        "application/json"
                      },
                      body: JSON.stringify({
                        paymentId
                      })
                    }
                  );

                const data =
                  await res.json();

                console.log(data);

                if (res.ok) {

                  log(
                    "✔️ approve OK"
                  );

                } else {

                  log(
                    "❌ approve failed"
                  );
                }

              } catch (e) {

                console.error(e);

                log(
                  "❌ approve network error"
                );
              }
            },

            // =====================
            // COMPLETE
            // =====================

            onReadyForServerCompletion:
            async function(paymentId, txid) {

              log(
                "COMPLETE: " +
                paymentId
              );

              try {

                const res =
                  await fetch(
                    "/api/complete",
                    {
                      method: "POST",
                      headers: {
                        "Content-Type":
                        "application/json"
                      },
                      body: JSON.stringify({
                        paymentId,
                        txid
                      })
                    }
                  );

                const data =
                  await res.json();

                console.log(data);

                if (res.ok) {

                  log(
                    "🎉 Paiement terminé"
                  );

                } else {

                  log(
                    "❌ complete failed"
                  );
                }

              } catch (e) {

                console.error(e);

                log(
                  "❌ complete network error"
                );
              }
            },

            // =====================
            // CANCEL
            // =====================

            onCancel: function() {

              setStatus(
                "⚠️ Paiement annulé"
              );
            },

            // =====================
            // ERROR
            // =====================

            onError: function(error) {

              console.error(error);

              log(
                "❌ Payment Error"
              );

              setStatus(
                "❌ Erreur paiement Pi\n\n" +
                JSON.stringify(error)
              );
            }

          }
        );

      } catch (e) {

        console.error(e);

        setStatus(
          "❌ createPayment FAILED"
        );
      }
    }

    // =========================
    // TESTNET REWARD
    // =========================

    async function sendTestReward() {

      const addr =
        document
        .getElementById(
          "friend-wallet"
        )
        .value
        .trim();

      if (!addr) {

        alert(
          "Veuillez entrer une adresse wallet"
        );

        return;
      }

      if (!currentUser) {

        alert(
          "Utilisateur Pi non connecté"
        );

        return;
      }

      setStatus(
        "🔄 Envoi récompense Testnet..."
      );

      try {

        const res =
          await fetch(
            "/api/testnet-reward",
            {
              method: "POST",
              headers: {
                "Content-Type":
                "application/json"
              },

              body: JSON.stringify({

                userWalletAddress:
                  addr,

                uid:
                  currentUser.uid
              })
            }
          );

        const data =
          await res.json();

        console.log(data);

        if (res.ok) {

          log(
            "✔️ Récompense envoyée"
          );

          log(
            "Wallet: " + addr
          );

          alert(
            "Transaction Testnet réussie !"
          );

        } else {

          console.error(data);

          log(
            "❌ Échec transaction"
          );

          alert(
            "Erreur transaction Testnet"
          );
        }

      } catch (e) {

        console.error(e);

        log(
          "❌ Erreur réseau"
        );
      }
    }

  </script>

</body>

</html>
