<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Pro + Pi Network</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

/* ===========================
    RESET
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

/* ===========================
    BODY
=========================== */

body{
    background:#f4f6f8;
    min-height:100vh;
}

/* ===========================
    TOP BAR
=========================== */

.topbar{
    background:#5c2d91;
    color:white;
    padding:15px;
    text-align:center;
}

.topbar h1{
    margin-bottom:10px;
}

.top-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.top-buttons button{
    background:white;
    color:#5c2d91;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.top-buttons button:hover{
    opacity:.9;
}

/* ===========================
    STATUS
=========================== */

.status-box{
    max-width:1200px;
    margin:15px auto;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

#status{
    white-space:pre-line;
}

.counter{
    margin-top:10px;
    font-weight:bold;
}

/* ===========================
    LAYOUT
=========================== */

.container{
    display:flex;
    width:100%;
}

/* ===========================
    FORMULAIRE
=========================== */

.form-section{
    width:40%;
    background:white;
    padding:20px;
    overflow-y:auto;
    border-right:2px solid #ddd;
}

.form-section h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.action-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.action-buttons button{
    border:none;
    background:#007bff;
    color:white;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
}

.action-buttons button:hover{
    background:#0056b3;
}

/* ===========================
    PREVIEW
=========================== */

.cv-section{
    width:60%;
    padding:20px;
}

.cv{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.header{
    text-align:center;
    border-bottom:2px solid #ddd;
    padding-bottom:10px;
}

.header h1{
    color:#007bff;
}

.section{
    margin-top:15px;
}

.section h3{
    border-bottom:1px solid #ddd;
    margin-bottom:5px;
    color:#333;
}

.section p{
    white-space:pre-line;
}

/* ===========================
    WALLET BOX
=========================== */

.wallet-box{
    margin-top:20px;
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

.wallet-box input{
    margin-top:10px;
}

/* ===========================
    DARK MODE
=========================== */

body.dark{
    background:#111;
}

body.dark .form-section,
body.dark .cv,
body.dark .status-box{
    background:#1f1f1f;
    color:white;
}

body.dark input,
body.dark textarea{
    background:#2c2c2c;
    color:white;
    border-color:#444;
}

/* ===========================
    MOBILE
=========================== */

@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .form-section,
    .cv-section{
        width:100%;
    }

}

/* ===========================
    PRINT
=========================== */

@media print{

    .topbar,
    .status-box,
    .form-section{
        display:none;
    }

    .cv-section{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="topbar">

    <h1>🍳 CV Pro + Pi Network</h1>

    <div class="top-buttons">

        <button onclick="login()">
            🔑 Connecter Pi
        </button>

        <button onclick="toggleDark()">
            🌙 Mode sombre
        </button>

    </div>

</div>

<div class="status-box">

    <div id="status">
Chargement...
    </div>

    <div class="counter" id="counter">
Transactions : 0 / 10
    </div>

</div>

<div class="container">

    <div class="form-section">

        <h2>Créer ton CV</h2>

        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" id="name">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" id="email">
        </div>

        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" id="phone">
        </div>

        <div class="form-group">
            <label>Profil</label>
            <textarea id="profile"></textarea>
        </div>

        <div class="form-group">
            <label>Compétences</label>
            <textarea id="skills"></textarea>
        </div>

        <div class="form-group">
            <label>Expériences</label>
            <textarea id="experience"></textarea>
        </div>

        <div class="form-group">
            <label>Formation</label>
            <textarea id="education"></textarea>
        </div>

        <div class="form-group">
            <label>Langues</label>
            <textarea id="languages"></textarea>
        </div>

        <div class="action-buttons">

            <button onclick="generateCV()">
                Générer CV
            </button>

            <button onclick="payAndDisplayCV()">
                👁️ Afficher mon CV (0.001 π)
            </button>

            <button onclick="clearData()">
                🗑 Effacer
            </button>

        </div>

        <div class="wallet-box">

            <h3>Wallet Testnet</h3>

            <input
                id="walletAddress"
                placeholder="Adresse G..."
            >

            <div class="action-buttons">

                <button onclick="saveWallet()">
                    💾 Ajouter Adresse
                </button>

            </div>

        </div>

    </div>

    <div class="cv-section">

        <div class="cv" id="cv">

            <div class="header">

                <h1 id="cv-name">
                    Nom Prénom
                </h1>

                <p id="cv-contact">
                    email | téléphone
                </p>

            </div>

            <div class="section">
                <h3>Profil</h3>
                <p id="cv-profile"></p>
            </div>

            <div class="section">
                <h3>Compétences</h3>
                <p id="cv-skills"></p>
            </div>

            <div class="section">
                <h3>Expériences</h3>
                <p id="cv-experience"></p>
            </div>

            <div class="section">
                <h3>Formation</h3>
                <p id="cv-education"></p>
            </div>

            <div class="section">
                <h3>Langues</h3>
                <p id="cv-languages"></p>
            </div>

        </div>

    </div>

</div>

<script>

/* ===========================
   PI SDK
=========================== */

if (!window.Pi) {
  document.getElementById("status").innerText =
    "❌ Ouvre cette application dans Pi Browser.";
} else {

  const Pi = window.Pi;

  Pi.init({
    version: "2.0",
    sandbox: true
  });

  window.PiApp = Pi;
}

/* ===========================
   GLOBALS
=========================== */

let currentUser = null;
let txCount = 0;
let walletList = [];
let paymentRunning = false;
let cvUnlocked = false;

/* ===========================
   STATUS
=========================== */

function setStatus(msg){
  document.getElementById("status").innerText = msg;
}

function updateCounter(){
  document.getElementById("counter").innerText =
    "Transactions : " + txCount + " / 10";
}

/* ===========================
   CV GENERATOR
=========================== */

function generateCV(){

  document.getElementById("cv-name").innerText =
    document.getElementById("name").value || "Nom Prénom";

  document.getElementById("cv-contact").innerText =
    (document.getElementById("email").value || "") +
    " | " +
    (document.getElementById("phone").value || "");

  document.getElementById("cv-profile").innerText =
    document.getElementById("profile").value;

  document.getElementById("cv-skills").innerText =
    formatList(document.getElementById("skills").value);

  document.getElementById("cv-experience").innerText =
    formatList(document.getElementById("experience").value);

  document.getElementById("cv-education").innerText =
    formatList(document.getElementById("education").value);

  document.getElementById("cv-languages").innerText =
    formatList(document.getElementById("languages").value);
}

/* ===========================
   FORMAT LIST
=========================== */

function formatList(text){

  if(!text.trim()) return "";

  return text
    .split("\n")
    .filter(v => v.trim())
    .map(v => "• " + v)
    .join("\n");

}

/* ===========================
   AUTOSAVE
=========================== */

const fields = document.querySelectorAll("input, textarea");

fields.forEach(field => {

  field.addEventListener("input", () => {

    localStorage.setItem(
      field.id,
      field.value
    );

    generateCV();

  });

});

/* ===========================
   LOAD DATA
=========================== */

function loadSavedData(){

  fields.forEach(field => {

    field.value =
      localStorage.getItem(field.id) || "";

  });

  generateCV();

}

/* ===========================
   CLEAR DATA
=========================== */

function clearData(){

  if(!confirm("Effacer toutes les données ?"))
    return;

  fields.forEach(field => {

    field.value = "";

    localStorage.removeItem(field.id);

  });

  generateCV();

}

/* ===========================
   DARK MODE
=========================== */

function toggleDark(){

  document.body.classList.toggle("dark");

}

/* ===========================
   WALLET MANAGEMENT
=========================== */

function saveWallet(){

  const input =
    document.getElementById("walletAddress");

  const address =
    input.value.trim();

  if(!address){

    alert("Adresse vide");
    return;

  }

  if(
    !address.startsWith("G") ||
    address.length !== 56
  ){
    alert("Adresse invalide");
    return;
  }

  walletList.push(address);

  input.value = "";

  setStatus(
    "✅ Wallet ajouté\n\n" +
    walletList.join("\n")
  );

}

/* ===========================
   APPROVE
=========================== */

async function approvePayment(paymentId){

  const res = await fetch(
    "/api/approve",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        paymentId
      })
    }
  );

  const data = await res.json();

  if(!res.ok){

    throw new Error(
      data.error ||
      "approve failed"
    );

  }

  return data;

}

/* ===========================
   COMPLETE
=========================== */

async function completePayment(
  paymentId,
  txid
){

  const res = await fetch(
    "/api/complete",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        paymentId,
        txid
      })
    }
  );

  const data = await res.json();

  if(!res.ok){

    throw new Error(
      data.error ||
      "complete failed"
    );

  }

  return data;

}

/* ===========================
   LOGIN PI
=========================== */

async function login(){

  try{

    if(!window.PiApp)
      throw new Error(
        "Pi SDK indisponible"
      );

    setStatus(
      "🔄 Connexion..."
    );

    const auth =
      await window.PiApp.authenticate(
        ["payments","username"],
        onIncompletePaymentFound
      );

    currentUser = auth.user;

    setStatus(
      "✅ Connecté\n\n" +
      currentUser.username
    );

  }
  catch(e){

    setStatus(
      "❌ " + e.message
    );

  }

}

/* ===========================
   INCOMPLETE PAYMENT
=========================== */

async function onIncompletePaymentFound(payment){

  try{

    const paymentId =
      payment.identifier;

    const txid =
      payment.transaction
      ? payment.transaction.txid
      : null;

    if(
      payment.status
      &&
      payment.status.developer_approved === false
    ){
      await approvePayment(paymentId);
    }

    if(
      payment.status
      &&
      payment.status.developer_completed === false
      &&
      txid
    ){
      await completePayment(
        paymentId,
        txid
      );
    }

    setStatus(
      "✅ Paiement incomplet résolu"
    );

  }
  catch(e){

    setStatus(
      "❌ " + e.message
    );

  }

}

/* ===========================
   DOWNLOAD PDF (CONSERVÉ MAIS NON UTILISÉ APRÈS LE PAIEMENT)
=========================== */

function downloadCV(){

  generateCV();

  const element =
    document.getElementById("cv");

  html2pdf()
    .set({
      margin:0.5,
      filename:"Mon_CV.pdf",
      image:{
        type:"jpeg",
        quality:1
      },
      html2canvas:{
        scale:2
      },
      jsPDF:{
        unit:"in",
        format:"a4",
        orientation:"portrait"
      }
    })
    .from(element)
    .save();

}

/* ===========================
   AFFICHAGE PLEIN ÉCRAN DU CV
=========================== */

function displayFullCV(){
  // Générer le CV à jour
  generateCV();
  
  // Masquer complètement la section formulaire
  const formSec = document.querySelector(".form-section");
  if(formSec) formSec.style.display = "none";
  
  // Afficher la section CV sur toute la largeur
  const cvSec = document.querySelector(".cv-section");
  if(cvSec) cvSec.style.width = "100%";
  
  // Mettre à jour le message de statut
  setStatus(
    "✅ Paiement confirmé\n" +
    "📄 Votre CV est maintenant affiché.\n" +
    "📱 Faites une capture d'écran pour le conserver."
  );
}

/* ===========================
   PAYMENT + DISPLAY
=========================== */

function payAndDisplayCV(){

  if(cvUnlocked){
    displayFullCV();
    return;
  }

  if(!currentUser){

    alert(
      "Connecte-toi à Pi d'abord"
    );

    return;

  }

  if(paymentRunning){

    alert(
      "Paiement déjà en cours"
    );

    return;

  }

  paymentRunning = true;

  window.PiApp.createPayment(
    {
      amount:0.001,
      memo:"Affichage CV Pro",
      metadata:{
        type:"cv"
      }
    },
    {

      onReadyForServerApproval:
      async function(paymentId){

        try{

          setStatus(
            "🟡 Approbation..."
          );

          await approvePayment(
            paymentId
          );

          setStatus(
            "✅ Approuvé"
          );

        }
        catch(e){

          paymentRunning = false;

          setStatus(
            "❌ " + e.message
          );

        }

      },

      onReadyForServerCompletion:
      async function(
        paymentId,
        txid
      ){

        try{

          setStatus(
            "🟡 Finalisation..."
          );

          await completePayment(
            paymentId,
            txid
          );

          txCount++;

          updateCounter();

          cvUnlocked = true;

          paymentRunning = false;

          // Déclenchement de l'affichage plein écran au lieu du téléchargement
          displayFullCV();

        }
        catch(e){

          paymentRunning = false;

          setStatus(
            "❌ " + e.message
          );

        }

      },

      onCancel:function(){

        paymentRunning = false;

        setStatus(
          "❌ Paiement annulé"
        );

      },

      onError:function(err){

        paymentRunning = false;

        setStatus(
          "❌ " +
          JSON.stringify(err)
        );

      }

    }
  );

}

/* ===========================
   SHORTCUTS
=========================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.ctrlKey &&
      e.key === "s"
    ){

      e.preventDefault();

      generateCV();

      alert(
        "CV sauvegardé"
      );

    }

  }
);

/* ===========================
   WINDOW LOAD
=========================== */

window.onload = () => {

  loadSavedData();

  updateCounter();

  setStatus(
    "✅ Application prête"
  );

};

  </script>

</body>
</html>
