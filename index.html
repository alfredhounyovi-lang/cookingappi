<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Cooking App Test</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    #status {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <h1>🍳 Cooking App</h1>

  <button onclick="connectPi()">
    Connecter Pi
  </button>

  <div id="status">
    En attente...
  </div>

  <script>

const statusDiv = document.getElementById("status");
let PiInstance = null;

function setStatus(msg) {
  statusDiv.innerText = msg;
  console.log(msg);
}

function waitForPi() {
  return new Promise((resolve, reject) => {

    let tries = 0;

    const interval = setInterval(() => {

      tries++;

      if (window.Pi) {
        clearInterval(interval);
        resolve(window.Pi);
      }

      if (tries > 30) {
        clearInterval(interval);
        reject(new Error("Pi SDK not loaded"));
      }

    }, 300);
  });
}

async function connectPi() {

  try {

    setStatus("🔄 Chargement Pi SDK...");

    const Pi = await waitForPi();

    Pi.init({
      version: "2.0",
      sandbox: true
    });

    PiInstance = Pi;

    setStatus("🔄 Authentification Pi...");

    const auth = await Pi.authenticate(
      ["username", "payments"],
      function(payment) {
        console.log(payment);
      }
    );

    setStatus(
      "✅ Connecté\n\n" +
      "Utilisateur: " + auth.user.username + "\n" +
      "UID: " + auth.user.uid
    );

  } catch (e) {

    console.error(e);

    setStatus(
      "❌ Erreur Pi SDK\n\n" +
      (e.message || JSON.stringify(e))
    );
  }
}

      </script>
</body>
</html>
